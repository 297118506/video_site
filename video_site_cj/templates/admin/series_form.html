{% extends 'base.html' %}

{% block title %}创建系列 - 后台{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 admin-sidebar">
            {% include "admin/_sidebar.html" %}
        </aside>
        <main class="col-md-10">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="bi bi-plus"></i> 创建系列</h2>
                <a href="{{ url_for('admin_series') }}" class="btn btn-secondary">返回列表</a>
            </div>
            
            <form method="POST">
                <div class="card mb-3">
                    <div class="card-header">系列信息</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">系列名称 <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" required value="{{ series.title or '' }}">
                        </div>
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">封面图片URL</label>
                                <input type="url" name="cover" class="form-control" value="{{ series.cover or '' }}" placeholder="https://...">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">分类</label>
                                <select name="category_id" class="form-select">
                                    <option value="0">未分类</option>
                                    {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">系列描述</label>
                            <textarea name="description" class="form-control" rows="3">{{ series.description or '' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">预计总集数</label>
                            <input type="number" name="total_episodes" class="form-control" value="{{ series.total_episodes or 0 }}">
                        </div>
                    </div>
                </div>
                
                <div class="text-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check"></i> 创建系列
                    </button>
                    <a href="{{ url_for('admin_series') }}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </main>
    </div>
</div>
{% endblock %}
